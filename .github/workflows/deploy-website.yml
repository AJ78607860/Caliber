name: Deploy website to GitHub Pages

# Publishes the static site in ./website to https://caliberai.work/:
# homepage, AP demo, and the Caliber Intelligence dashboard (website/dashboard/)
# with its snapshot data. Publication of the dashboard data was approved by the
# repository owner on 2026-11-11.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "CNAME"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble public site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R website/. _site/
          # Keep the custom domain alongside the published files.
          echo "caliberai.work" > _site/CNAME
          echo "Published files:"
          find _site -type f | sort

      - name: Validate site
        run: |
          set -euo pipefail
          test -f _site/index.html || { echo "::error::index.html missing at artifact root"; exit 1; }
          test -f _site/dashboard/index.html || { echo "::error::dashboard/index.html missing"; exit 1; }
          # Snapshot directories the dashboard fetches at runtime must be present.
          for d in ap_cache atlas_cache metrics_cache navc_cache payments_cache swiss_cache treasury_cache; do
            test -f "_site/dashboard/data/$d/snapshots/_meta.json" || { echo "::error::missing dashboard data: $d"; exit 1; }
          done
          test -f _site/dashboard/data/audit/audit.jsonl || { echo "::error::missing dashboard audit log"; exit 1; }
          # Every local href/src/url() reference must resolve inside the artifact.
          missing=0
          for f in $(find _site -name '*.html'); do
            dir=$(dirname "$f")
            # Skip JS template placeholders (${...}) and root paths served by other infra (/cdn-cgi/...).
            for ref in $(grep -oE "(href|src)=\"[^\"#:]+\"|url\('[^'#:]+'\)" "$f" | sed -E "s/^(href|src)=\"//; s/\"$//; s/^url\('//; s/'\)$//" | grep -vE '\$\{|^/' | sort -u); do
              target="$dir/$ref"
              [ -e "$target" ] || [ -e "${target%/}/index.html" ] || { echo "::error file=$f::Broken local reference: $ref"; missing=1; }
            done
          done
          exit $missing

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
